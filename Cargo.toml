[package]
name = "desktop-template"
version = "0.1.0"
edition = "2024"
description = "Plantilla de aplicación de escritorio Win32 con Rust"
license = "MPL-2.0"

[dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }

[[bin]]
name = "tray-app"
path = "src/main.rs"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.toml]
version = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true